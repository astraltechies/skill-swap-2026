[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Backstop for static assets and error pages that Next's own `headers()` does
# not run for. Values must match next.config.ts or responses carry two
# conflicting copies of the same header.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Camera/mic name meet.jit.si explicitly — their default allowlist is
    # `self`, which does not reach a cross-origin iframe, so the video call
    # would open silent and black. Keep in step with next.config.ts.
    Permissions-Policy = "camera=(self \"https://meet.jit.si\"), microphone=(self \"https://meet.jit.si\"), display-capture=(self \"https://meet.jit.si\"), geolocation=(), interest-cohort=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
